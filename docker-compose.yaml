services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp
    ports:
        - 8765:8765
    networks:
        - otobo_default
    environment:
        - OTOBO_MCP_INTERNAL_URL=http://web:5000
        - OTOBO_MCP_PUBLIC_URL=https://localhost/otobo/index.pl
        - OTOBO_MCP_WEBSERVICE=OTOBO-AI
        - OTOBO_MCP_SSL_VERIFY=false
        - OTOBO_MCP_TIMEOUT=30
        - OTOBO_MCP_TRANSPORT=streamable-http
        - OTOBO_MCP_BIND=0.0.0.0
        - OTOBO_MCP_PORT=8765
        # see https://docs.python.org/3/library/logging.html#logging-levels
        # for loglevel description
        - OTOBO_MCP_LOGLEVEL=40
        # tools enabled for this server
#        - OTOBO_MCP_ENABLED_TOOLS=faq_fulltext_search,get_link_to_faq,get_ticket_details,ticket_fulltext_search,unlink_ticket_to_ticket,find_similar_tickets,get_link_to_ticket,link_ticket_to_ticket,transfer_ticket_to_destination_queue,update_generated_response
        # fence around each tool result, must contain {nonce}, prefix and suffix must differ
        - OTOBO_MCP_FENCE_PREFIX=<<<OTOBO_DATA_BEGIN {nonce}>>>
        - OTOBO_MCP_FENCE_SUFFIX=<<<OTOBO_DATA_END {nonce}>>>
        # default token limit of a read-only tool result, longer results are chunked
        - OTOBO_MCP_MAX_TOKENS=8000
        - OTOBO_MCP_CHARS_PER_TOKEN=3
        # run without MCP sessions, eg for several workers
        - OTOBO_MCP_STATELESS=false
        # oauth specific
        - OTOBO_MCP_OAUTH=false
        - OTOBO_MCP_ISSUER_URL=https://keycloak:8443/realms/master
        - OTOBO_MCP_RESOURCE_SERVER_URL=http://mcp:8765/mcp
        - OTOBO_MCP_SCOPES=email


networks:
  otobo_default:
    external: true

